{% extends 'emails/base.html' %}

{% block heading %}Reset your password{% endblock %}

{% block content %}
  <p style="margin:0 0 16px;font-size:15px;line-height:1.6">
    Use the link below to choose a new password. It expires in {{ timeout_hours }} hours.
  </p>
  <p style="margin:0 0 16px">
    {% include 'emails/_button.html' with label='Choose a new password' %}
  </p>
  <p style="margin:0;font-size:13px;color:#71717a;word-break:break-all">{{ link }}</p>
{% endblock %}
