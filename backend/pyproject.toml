[project]
name = "cohort-app-backend"
version = "0.1.0"
description = "Django backend for the Cohort base app"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.0",
    "django>=5.2,<6",
    "django-environ>=0.12",
    "djangorestframework>=3.16",
    "gunicorn>=26.2.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
