<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="AGENTSdotNE Cohort base app">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="#121212"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect y="304" width="1280" height="16" fill="#C5E63A"/>
  </g>
  <rect x="72" y="88" width="128" height="128" rx="28" fill="#C5E63A"/>
  <image href="data:image/png;base64," x="88" y="104" width="96" height="96"/>
  <g font-family="'Space Grotesk', 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="240" y="112" fill="#C5E63A" font-size="20" font-weight="600" letter-spacing="4">AGENTSdotNE · NORTH EAST ENGLAND</text>
    <text x="236" y="196" fill="#FFFFFF" font-size="84" font-weight="700" letter-spacing="-2">Cohort base app</text>
    <text x="240" y="240" fill="#A3A3A3" font-size="24">Django and React, with the boring parts already done.</text>
  </g>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18">
    <rect x="964" y="40" width="260" height="44" rx="10" fill="#1C1C1C" stroke="#2E2E2E"/>
    <circle cx="988" cy="62" r="5" fill="#FF5F57"/>
    <circle cx="1006" cy="62" r="5" fill="#FEBC2E"/>
    <circle cx="1024" cy="62" r="5" fill="#28C840"/>
    <text x="1044" y="68" fill="#C5E63A">&gt;</text>
    <text x="1062" y="68" fill="#E5E5E5">make install</text>
  </g>
</svg>
