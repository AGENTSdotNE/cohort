services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cohort
      POSTGRES_USER: cohort
      POSTGRES_PASSWORD: cohort
    ports:
      - '5442:5432'
    volumes:
      - cohort-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cohort']
      interval: 5s
      retries: 10

volumes:
  cohort-db:
